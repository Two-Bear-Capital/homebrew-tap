# Canonical automated Claude PR review. THIS repo-level copy is generated —
# do NOT hand-edit it (a drifted copy is a review finding). The single source
# lives in the tbc-platform-workspace meta-repo at scripts/workflows/claude-code-review.yml;
# edit it there and re-run `make workflows` to roll the change out everywhere.
#
# This runs Claude in non-interactive review mode on every PR (no @claude
# mention needed) and reviews the diff against the Two Bear conventions
# catalog, which is sparse-checked-out from the private workspace repo so the
# review sees the SAME single-source rules the repos import — no duplication.
#
# Secrets (both org-level; provisioned from 1Password by the workspace's
# scripts/provision-review-secrets.sh / `make review-secrets`):
#   CLAUDE_CODE_OAUTH_TOKEN — auth for the Claude Code action.
#   WORKSPACE_RO_TOKEN      — read-only token with access to the private
#                             tbc-platform-workspace repo (the default
#                             GITHUB_TOKEN cannot check out a sibling repo).
name: Claude Code Review

on:
  pull_request:
    # ONE complete review per PR, plus an explicit re-request — NOT one per push.
    #
    # `synchronize` was removed deliberately and the measurement is the reason: across
    # 30 days, on the PRs that went multiple rounds, 60 of Claude's 131 findings arrived
    # AFTER round one, and 68% of those landed on a file round one had already commented
    # on. That is not new code being caught; it is the same diff re-read, dribbling
    # findings out one round at a time while the author waits. Copilot already reviews
    # once on 87% of PRs and the sky does not fall.
    #
    # To get another pass — a substantial rewrite, a fix you want a second opinion on —
    # add the `re-review` label (remove and re-add it to run again), or comment @claude,
    # which claude.yml handles. Both are deliberate acts, which is the point.
    #
    # If defects start reaching main that a second pass would have caught, put
    # `synchronize` back: that is the first thing to reverse.
    types: [opened, reopened, labeled]
    # Don't spend an LLM review on a diff with nothing reviewable in it: pure
    # lockfile bumps and generated output. `paths-ignore` skips the run only when
    # EVERY changed file matches, so a PR touching a lockfile *and* real code is
    # still reviewed in full.
    #
    # A top-level paths-ignore is safe HERE — and only here — because this
    # workflow's check is not a branch-protection required context in any repo
    # (verified across all 14; the required contexts are `ci`, or the
    # lint/test/security trio). On ci.yml the same block would deadlock: the
    # required check would never report and the PR would hang on "Expected —
    # waiting for status". See the ci-performance topic in the conventions
    # catalog, which each repo imports from tbc-platform-workspace (checked out
    # to .workspace/conventions/ by the job below). If this workflow's check is
    # ever made required, delete this block.
    paths-ignore:
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/yarn.lock"
      - "**/uv.lock"
      - "**/poetry.lock"
      - "**/go.sum"
      - "**/Cargo.lock"
      - "**/.terraform.lock.hcl"
      - "**/*.gen.go"
      - "**/generated/**"

# One in-flight review per PR; a new push cancels the prior run.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip bot PRs (Dependabot non-major updates auto-merge and aren't gated on
    # review), and skip fork PRs: a fork can't see the org secrets, so the action
    # would fail to authenticate and just spew red checks. Same-repo PRs only.
    #
    # Filter the PR AUTHOR, not github.actor: the actor is whoever triggered THIS
    # event, so a maintainer reopening or pushing to a Dependabot PR makes the
    # actor a human and the skip misses. user.login is stable across every event
    # on the PR.
    #
    # The `labeled` clause: that event fires for EVERY label, so without this a routine
    # `bug` or `dependencies` label would spend a full LLM review. Only `re-review` does.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 're-review')
    runs-on: ubuntu-latest
    timeout-minutes: 20 # LLM review is bounded; cap true hangs
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read # Claude reads CI results on the PR
    steps:
      # This checkout KEEPS its persisted credential, deliberately. The action
      # runs `git fetch origin --depth=N <branch>` against this working tree
      # (claude-code-action src/github/operations/branch.ts) BEFORE it rewrites
      # origin with its own token, so removing the credential makes that fetch
      # unauthenticated and it fails with exit 128 on a private repo.
      #
      # Dropping it here bought nothing anyway: the action already strips this
      # credential itself once it no longer needs it — from the local config and
      # from every include.path file, which is what actions/checkout v6+ needs
      # (src/github/operations/git-config.ts, replaceCheckoutCredentials).
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Degrade gracefully: if WORKSPACE_RO_TOKEN is absent/expired the review
      # still runs against the repo's own CLAUDE.md rather than failing every PR.
      - name: Checkout conventions catalog
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Two-Bear-Capital/tbc-platform-workspace
          token: ${{ secrets.WORKSPACE_RO_TOKEN }}
          # conventions/ is what the review reads. The four scripts/ directories are the canonical
          # sources a sync PR is compared against, and scripts/verify-canonical-sync.sh is the
          # comparison itself — run from HERE, never from the PR (see the verify step).
          sparse-checkout: |
            conventions/
            scripts/workflows/
            scripts/workflow-scripts/
            scripts/copilot/
            scripts/pr-template/
            scripts/verify-canonical-sync.sh
          sparse-checkout-cone-mode: false
          path: .workspace
          # THIS is the one that matters, and it stays. actions/checkout would
          # otherwise leave WORKSPACE_RO_TOKEN — which reaches the PRIVATE
          # workspace repo — in .workspace/.git/config, where the review step
          # can read it: that step runs over untrusted PR content with
          # unrestricted `Read` and `Bash(gh pr comment:*)`.
          #
          # The action's own credential cleanup does NOT cover this: it runs
          # `git config` against the working directory only, so it never touches
          # .workspace/.git/config. Nothing ever fetches from this checkout
          # either, so unlike the one above it costs nothing to drop.
          persist-credentials: false

      # Graceful degradation must be LOUD. The checkout above is continue-on-error so a
      # dead token cannot red every PR in the org — that trade is right and stays. But
      # for a month or more (workspace#153) WORKSPACE_RO_TOKEN was over the enterprise's
      # 366-day PAT cap, the checkout failed on EVERY run, and every automated review in
      # the org judged PRs without the conventions catalog. Nobody noticed, because a
      # degraded run looked exactly like a healthy one on the run page.
      #
      # The replacement PAT is capped at 366 days by the same rule, so this recurs on a
      # timer. `make ci-audit` probes for it across repos; this step makes the single run
      # say so out loud.
      - name: Check the conventions catalog arrived
        if: always()
        run: |
          if [ -n "$(ls -A .workspace/conventions 2>/dev/null)" ] || [ -d conventions ]; then
            echo "Conventions catalog available." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning title=Degraded review::Conventions catalog unavailable — reviewing against this repo's CLAUDE.md only. Check WORKSPACE_RO_TOKEN (see tbc-platform-workspace#153)."
          {
            echo "### ⚠️ Degraded review"
            echo
            echo "\`.workspace/conventions/\` is empty and there is no \`conventions/\` at the repo root,"
            echo "so this review ran against the repo's own \`CLAUDE.md\` and general best practice —"
            echo "**not** the shared conventions catalog."
            echo
            echo "Most likely \`WORKSPACE_RO_TOKEN\` has expired. See [workspace#153](https://github.com/Two-Bear-Capital/tbc-platform-workspace/issues/153)."
          } >> "$GITHUB_STEP_SUMMARY"

      # A PURE canonical sync is not LLM-reviewed here. The canonical workflows, scripts and templates are
      # reviewed once, at their source in tbc-platform-workspace, and copied byte-for-byte into every
      # repo; commits-and-releases.md exempts those sync PRs from a second review, but until this step
      # nothing enforced it. Over ten days that meant 157 sync PRs across 14 repos, ~9 distinct findings,
      # and the same canonical defect reported up to 14 times, each in a repo that cannot fix it.
      #
      # The exemption is now mechanical: every changed file must be in the canonical set and
      # byte-identical (blob SHA, and file mode) to its source. The moment anyone edits a copy the PR
      # stops being a sync and the full review below runs. Any error in the check also runs the full
      # review — the saving is never worth an unreviewed PR.
      #
      # The verifier is run FROM THE WORKSPACE CHECKOUT, not from the PR. What authorizes skipping a
      # review must not be controlled by the thing being reviewed: a PR that edited a repo-local copy
      # of the script could make it print verified=true, skipping the review of that very PR, with this
      # job's write token in hand. For the same reason it is not one of the files that gets synced.
      # If the checkout is unavailable there is no verdict, and the full review runs.
      - name: Verify canonical sync
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          POST_COMMENT: "true" # once per head commit; the marker makes a re-run a no-op
        # A crash must fall back to the review too, not just a missing checkout: a step that FAILS makes
        # every later step with a plain `if:` skip (an implicit success() gate), so the review would be
        # skipped by a verifier bug. Only an exact verified=true skips it.
        run: |
          if [ -f .workspace/scripts/verify-canonical-sync.sh ]; then
            bash .workspace/scripts/verify-canonical-sync.sh || {
              echo "::warning title=Canonical-sync check crashed::running the full review."
              echo "verified=false" >> "$GITHUB_OUTPUT"
            }
          else
            echo "::warning title=Canonical-sync check unavailable::the workspace checkout is missing — running the full review."
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code Review
        id: review
        if: steps.sync.outputs.verified != 'true'
        uses: anthropics/claude-code-action@9cdae7f0d995e3ba7c33f226087fdf82a59cd520 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Surface the review ON the PR (like Copilot), not just in the Actions
          # log: track_progress posts a live tracking comment with the summary,
          # and the create_inline_comment tool (allow-listed below) posts
          # per-line findings. Without these the review runs but stays invisible.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the automated reviewer for a Two Bear Capital repository.
            Review this pull request against the Two Bear engineering
            conventions AND this repo's own CLAUDE.md.

            The canonical conventions catalog is checked out at
            `.workspace/conventions/` — or, when THIS repo is the workspace
            meta-repo itself, at `conventions/` in the repo root. Read the rules
            that apply to this repo's stack before reviewing — do not assume;
            open the files from whichever path exists. Only if NEITHER path is
            present (token lapsed on a non-workspace repo) fall back to this
            repo's own CLAUDE.md and general best practice, and note that
            conventions were unavailable. Key files when present:
              - dry-and-reuse.md      — new duplication is a BLOCKING finding;
                                        shared logic belongs in its single home
                                        (e.g. tbc-core), not copy-pasted.
              - engineering-judgment.md
              - commits-and-releases.md — the PR TITLE must be a valid
                                        Conventional Commit subject (it becomes
                                        the squash commit / release note).
              - secrets-and-config.md — never committed secrets, never logged.
              - testing.md            — changed logic ships with tests; ≥80%
                                        coverage; a logic change without tests
                                        is a finding.
              - data-boundaries.md    — analytical reads via public_datamart
                                        only; parameterized SQL; vendor creds
                                        stay behind the core boundary.
              - logging.md, python.md, make-hub.md, cli-contract.md — apply
                                        where the repo's stack matches.

            TAG EVERY FINDING `BLOCKING:` OR `ADVISORY:` — the first word of the
            finding. The tag decides whether the PR can merge, so it is part of
            the finding, not decoration.

              * BLOCKING — wrong behaviour, a security hole, a secret or PII
                crossing into a wider trust domain, a data-layer boundary
                violation, changed logic shipped with no test, or new
                duplication of logic that already has a single home.
              * ADVISORY — everything else: stale prose, naming, structure, a
                cleanup worth doing later.

            Only blocking threads gate the merge. Advisory findings are NOT
            discarded — every unresolved one is filed automatically as a tracked
            issue when the PR merges. So file an advisory finding freely rather
            than inflating it to blocking to be sure it survives. Judge by
            consequence, not by your confidence: "this might be wrong and if it
            is, the write silently corrupts a record" is blocking; "this name
            could be clearer" is advisory however certain you are.

            REPORT THE DEFECT CLASS, NOT EACH INSTANCE. Before you report a
            defect, sweep for every other instance of the same class — the rest
            of the file, the sibling files, the repo — and report them as ONE
            finding listing every site. If the defect is a design flaw whose
            symptoms will recur, say so and name the CLASS-LEVEL fix rather than
            only the local patch.

            `engineering-judgment.md` in the catalog — which you are reading
            anyway — holds the canonical statement of this rule, what it was
            measured to cost, and the worked examples. Read it there; it is
            deliberately not restated here.

            Focus your review, in priority order:
              1. Correctness and security bugs in the diff.
              2. Convention violations, especially DRY / duplication and
                 missing tests for changed logic — including a test whose NAME
                 claims more than its assertions actually check.
              3. A non-Conventional-Commit PR title.
              4. Concrete, actionable cleanups — cite the rule you're applying.
              5. Prose accuracy, under the budget below.

            SPEND THE BUDGET ON CODE. These repos comment heavily by design, so
            prose is often most of a diff. Two limits keep it proportionate:

              * Flag a comment or doc ONLY when the code contradicts it — a
                stale reference, or a claim about behaviour the diff itself (or
                the code it describes) makes false. Never flag wording, tone,
                length or phrasing preference. If the statement is true, leave
                it.
              * Report restatement drift ONCE, STRUCTURALLY. When one fact is
                stated in several places and one has gone stale, the finding is
                "this fact is stated in N places; consolidate to one and link"
                — filed once, not once per site. Filing per site turns one
                structural problem into many rounds of the same conversation,
                and fixing the instance does not prevent the next one.

            There is deliberately NO numeric cap on prose findings. One was
            tried and removed on evidence: across 248 findings classified over
            30 days, pure wording/tone/phrasing was ONE finding, while 48 were
            comments the code actually contradicted — real defects, nearly all
            fixed. A cap suppresses the second group to solve the first, and the
            first is not happening. The "only when the code contradicts it" rule
            above is what keeps this cheap; a count is not.

            The authoring half of this is `comments-and-docs.md` in the
            catalog — at whichever of the two paths above exists — and its rule
            is that a claim about runtime behaviour belongs in a TEST, not a
            comment.

            Be specific and cite file:line. Post each concrete finding as an
            INLINE comment on the diff via the create_inline_comment tool; give
            the overall verdict in the top-level summary. Do not restate
            unchanged code or nitpick style the formatter owns. If the PR is
            clean, say so briefly in the summary — do not invent findings.

            END THE SUMMARY WITH THE COMMIT YOU REVIEWED:
            "Reviewed ${{ github.event.pull_request.head.sha }}."
            Reviews and fixes cross in flight here, and when they do the author
            cannot tell a stale finding from a live one and re-fixes something
            already fixed. Naming the SHA makes that visible instead of
            guessable.
          # The tool allowlist is not enough on its own. Before the model starts, claude-code-action's
          # configureGitAuth (always run; source checked at this pinned SHA) rewrites `origin` to
          # https://x-access-token:<app token>@github.com/... in .git/config unless
          # ALLOWED_NON_WRITE_USERS is set, and this step runs over untrusted PR content. Verified with a
          # planted fake credential: with no deny rule Read and Grep both return it; with the rule below
          # both are denied and the model does not work around it. Glob still lists names, never
          # contents. /proc/self/environ is the other place the token lives on a Linux runner (the
          # absolute-path `//` rule syntax was verified against /etc/hosts; /proc itself only exists on
          # the runner). scheduled-review.yml carries the same rule for the same reason.
          #
          # There is deliberately NO `Bash(gh pr comment:*)` here (it used to be). A Bash prefix rule
          # is a read channel the Read deny cannot see whenever the command takes a file path:
          # `gh pr comment --body-file .git/config` matches the prefix and posts the file. The engine
          # does deny `$(cat ...)`, backticks and `;`-chaining (tested, all three), but a path flag is
          # not a shell feature. The comment isn't needed: the review's summary is the action's own
          # tracking comment (track_progress above) and findings go through the inline-comment tool.
          # `gh pr view` and `gh pr diff` take a PR number, not a path.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*)"
            --disallowedTools "Read(./.git/**),Read(//proc/**)"

      # claude-code-action refuses to run — quietly, with only a ::warning:: — when this workflow's file
      # differs from the default branch's copy ("Workflow validation failed"): a GitHub App guard
      # against a PR rewriting the workflow that reviews it. The job still goes green, so a PR that
      # edits this workflow would show a passed review that never happened. `execution_file` is only
      # set when the model actually ran, so its absence is the signal.
      - name: Say so if the review did not run
        if: always() && steps.sync.outputs.verified != 'true' && steps.review.outputs.execution_file == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "::warning title=No automated review ran::The Claude review did not complete on this PR — it is NOT reviewed. If this PR edits claude-code-review.yml, the action skips itself by design."
          gh pr comment "$PR_NUMBER" --body "**The automated review did not run on this PR** (${HEAD_SHA}), so this is not a passed review. The Claude review skips itself when a PR edits the review workflow (a guard against a PR rewriting its own reviewer) and can fail for other reasons; check the run. This PR needs a human review."
