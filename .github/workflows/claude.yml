name: Claude Code

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # TRUST GATE: claude-code-action's own checks, before Claude starts. It refuses an actor
    # without WRITE access to the repo (permissions.ts: an API lookup of the actor's permission)
    # and any bot not in `allowed_bots`, which this job leaves empty (actor.ts). Those are the
    # guard on a public repo like homebrew-tap, where anyone can comment "@claude": the steps
    # before the action run only this repo's code, never the comment.
    #
    # This `if:` only keeps a runner from starting for nothing. It used to check
    # author_association too, which duplicated the write check badly: for a member whose org
    # membership is private, `issues: opened` never carried MEMBER, so opening an issue that
    # mentions @claude was skipped every time (tbc-platform#738). `sender.type` repeats the
    # action's bot refusal for the same reason, so an App's event (Core files issues as
    # `two-bear-core[bot]`, tbc-platform#526) starts nothing at all.
    #
    # ACCEPTED RISK (workspace#190): the job keeps unrestricted Bash because it commits and
    # pushes, so the session can read the action's short-lived app token (from .git/config, or
    # GH_TOKEN in its env). Hiding it from .git/config (#224) only moved it to GH_TOKEN and took
    # two workarounds, so it was undone. What remains is prompt injection via content a member
    # asks it to read; who can summon it is the control.
    if: >-
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30 # interactive bot may implement changes; cap runaway sessions
    permissions:
      contents: read
      pull-requests: write # @claude posts its reply onto the PR (matches claude-code-review.yml)
      issues: write # @claude posts its reply onto the issue
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # This checkout KEEPS its persisted credential, deliberately — do NOT add
      # `persist-credentials: false` here as a hardening pass. claude-code-action runs
      # `git fetch origin --depth=N <branch>` against this working tree BEFORE it rewrites
      # origin with its own token, so dropping the credential makes that fetch
      # unauthenticated and it dies with exit 128 on a private repo. That was tried
      # (workspace#147) and disproven by the PR's own failing job.
      #
      # It also buys nothing: the action strips this credential itself once it no longer
      # needs it (src/github/operations/git-config.ts, replaceCheckoutCredentials), given the
      # next step. The credential worth dropping is a SECOND checkout carrying a cross-repo
      # token — see the .workspace checkout in claude-code-review.yml, which nothing fetches from.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Workaround for anthropics/claude-code-action#1721; the script says why. Without it every
      # push fails "Write access to repository not granted". Delete when that is fixed.
      - name: Let the action find the checkout credential
        run: ./.github/scripts/expose-checkout-credential.sh

      # Without this, @claude runs with NONE of the shared conventions. Every repo's
      # CLAUDE.md imports the catalog by relative path (`@../conventions/core.md` and
      # friends), which resolves only in the workspace layout — so on a bare runner
      # checkout the imports silently no-op and the session loses Conventional Commits,
      # the secrets rules, DRY, the testing floor and the data boundaries. Silently, the
      # same shape as workspace#153.
      #
      # claude-code-review.yml solves this by telling Claude in its PROMPT to read
      # `.workspace/conventions/`. There is no prompt here — the user's @claude comment is
      # the prompt — so the catalog has to land where CLAUDE.md already looks instead.
      # See the materialise step below.
      #
      # Degrade gracefully: a token that can't be minted must not fail every @claude invocation.
      # Minted and revoked as in claude-code-review.yml, which says why it is an App.
      - name: Mint the conventions-catalog token
        id: catalog-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.GH_WORKSPACE_READER_CLIENT_ID }}
          private-key: ${{ secrets.GH_WORKSPACE_READER_SIGNING_KEY }}
          owner: Two-Bear-Capital
          repositories: tbc-platform-workspace
          permission-contents: read

      - name: Checkout conventions catalog
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Two-Bear-Capital/tbc-platform-workspace
          token: ${{ steps.catalog-token.outputs.token }}
          sparse-checkout: conventions/
          sparse-checkout-cone-mode: false
          path: .workspace
          # The catalog token reaches the PRIVATE workspace repo, and actions/checkout
          # would leave it in .workspace/.git/config where this session — which runs over
          # user-supplied comment text — could read it. The action's own cleanup only
          # touches the working directory, never this path. Nothing fetches from this
          # checkout, so dropping the credential costs nothing.
          persist-credentials: false

      # Non-trivial logic belongs in a checked-in script, not inline YAML
      # (conventions/make-hub.md): shellcheck-lintable, bash -n testable, and it reviews as
      # code. The script explains the path arithmetic and why `.workspace` is deleted.
      #
      # No `if: always()`. The step above is continue-on-error, which already lets this one run when
      # only the catalog checkout failed. `always()` ADDS one case: the mandatory repo checkout
      # having failed, when this script does not exist yet and the step would die with a
      # "No such file" that hides the real failure. (The same reasoning applies to the check in
      # claude-code-review.yml; test-canonical-workflows.py pins both.)
      - name: Materialise the catalog where CLAUDE.md imports it
        run: ./.github/scripts/materialise-conventions.sh

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
