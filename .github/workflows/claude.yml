name: Claude Code

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # TRUST GATE — only a repo owner, org member or collaborator can summon @claude.
    #
    # Without the author_association check this is a pwn request: `issue_comment` and
    # `issues` run in the BASE repo's context with full access to org secrets, and
    # `homebrew-tap` is PUBLIC, so anyone on the internet could open an issue saying
    # "@claude" and get a Claude Code session holding CLAUDE_CODE_OAUTH_TOKEN with
    # `pull-requests: write` and `issues: write` — and, once the catalog checkout below
    # exists, the workspace-reader App's key and the private conventions too. The prompt is the
    # attacker's comment text.
    #
    # Nothing has happened: this job has never executed in any repo. On a public repo
    # that is luck rather than design.
    #
    # claude-code-review.yml does not need this — it is `pull_request`-triggered and
    # already restricted to same-repo PRs, so a fork cannot reach it.
    #
    # ACCEPTED RISK (workspace#190): this gate is the guard, and deliberately the only one.
    # This job keeps unrestricted Bash because it commits and pushes, so no tool allowlist
    # can hide the action's app token from it. #224 moved the token out of .git/config (see
    # `allowed_non_write_users` below), so `git remote -v` and `cat .git/config` no longer
    # print it, but the action still exports it as GH_TOKEN for the session (run.ts), where
    # `env` prints it. What remains is prompt injection via content a trusted member asks it
    # to read. The token is a short-lived app token; whether the action revokes it at job end
    # is NOT verified for this workflow.
    #
    # No App can summon it either (tbc-platform#526). Core files issues as `two-bear-core[bot]`,
    # so content an agent wrote must never start a privileged session. `sender` is GitHub's record
    # of who acted, not text anyone can write. Every bot comment sampled across three repos
    # (claude[bot], github-actions[bot], dependabot[bot]; 2026-10-29) was author_association NONE,
    # so this refuses no bot that could summon @claude before; it stops relying on that labelling.
    if: >-
      github.event.sender.type != 'Bot' && (
        (
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        ) || (
          github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30 # interactive bot may implement changes; cap runaway sessions
    permissions:
      contents: read
      pull-requests: write # @claude posts its reply onto the PR (matches claude-code-review.yml)
      issues: write # @claude posts its reply onto the issue
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    # Setting allowed_non_write_users (below) also turns this on by default. At 1 it unsets
    # GH_TOKEN in every shell Claude runs, so the credential helper hands git an empty password
    # and pushes fail, and it forces the permission mode to default. Job-level, not on the step:
    # the action reads it from the env context, where its docs say to set it.
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "0"
    steps:
      # This checkout KEEPS its persisted credential, deliberately — do NOT add
      # `persist-credentials: false` here as a hardening pass. claude-code-action runs
      # `git fetch origin --depth=N <branch>` against this working tree BEFORE it rewrites
      # origin with its own token, so dropping the credential makes that fetch
      # unauthenticated and it dies with exit 128 on a private repo. That was tried
      # (workspace#147) and disproven by the PR's own failing job.
      #
      # It also buys nothing: the action strips this credential itself once it no longer
      # needs it (src/github/operations/git-config.ts, replaceCheckoutCredentials). The
      # credential worth dropping is a SECOND checkout carrying a cross-repo token — see
      # the .workspace checkout in claude-code-review.yml, which nothing fetches from.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Without this, @claude runs with NONE of the shared conventions. Every repo's
      # CLAUDE.md imports the catalog by relative path (`@../conventions/core.md` and
      # friends), which resolves only in the workspace layout — so on a bare runner
      # checkout the imports silently no-op and the session loses Conventional Commits,
      # the secrets rules, DRY, the testing floor and the data boundaries. Silently, the
      # same shape as workspace#153.
      #
      # claude-code-review.yml solves this by telling Claude in its PROMPT to read
      # `.workspace/conventions/`. There is no prompt here — the user's @claude comment is
      # the prompt — so the catalog has to land where CLAUDE.md already looks instead.
      # See the materialise step below.
      #
      # Degrade gracefully: a token that can't be minted must not fail every @claude invocation.
      # Minted and revoked as in claude-code-review.yml, which says why it is an App.
      - name: Mint the conventions-catalog token
        id: catalog-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.GH_WORKSPACE_READER_CLIENT_ID }}
          private-key: ${{ secrets.GH_WORKSPACE_READER_SIGNING_KEY }}
          owner: Two-Bear-Capital
          repositories: tbc-platform-workspace
          permission-contents: read

      - name: Checkout conventions catalog
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Two-Bear-Capital/tbc-platform-workspace
          token: ${{ steps.catalog-token.outputs.token }}
          sparse-checkout: conventions/
          sparse-checkout-cone-mode: false
          path: .workspace
          # The catalog token reaches the PRIVATE workspace repo, and actions/checkout
          # would leave it in .workspace/.git/config where this session — which runs over
          # user-supplied comment text — could read it. The action's own cleanup only
          # touches the working directory, never this path. Nothing fetches from this
          # checkout, so dropping the credential costs nothing.
          persist-credentials: false

      # Non-trivial logic belongs in a checked-in script, not inline YAML
      # (conventions/make-hub.md): shellcheck-lintable, bash -n testable, and it reviews as
      # code. The script explains the path arithmetic and why `.workspace` is deleted.
      #
      # No `if: always()`. The step above is continue-on-error, which already lets this one run when
      # only the catalog checkout failed. `always()` ADDS one case: the mandatory repo checkout
      # having failed, when this script does not exist yet and the step would die with a
      # "No such file" that hides the real failure. (The same reasoning applies to the check in
      # claude-code-review.yml; test-canonical-workflows.py pins both.)
      - name: Materialise the catalog where CLAUDE.md imports it
        run: ./.github/scripts/materialise-conventions.sh

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Not a user list. Any non-empty value switches the action's git auth from
          # https://x-access-token:<token>@... in origin's URL to a credential helper that reads
          # $GH_TOKEN, so .git/config holds no token (git-config.ts at the pinned SHA, #224).
          # Its other use, skipping the write-permission check for the listed users, applies
          # only when `github_token` is passed, which this step never does; and the underscore
          # makes it an impossible GitHub login, so it can't match an actor even then.
          allowed_non_write_users: credential_helper_only
          additional_permissions: |
            actions: read
