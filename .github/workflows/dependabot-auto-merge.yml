# Dependabot auto-merge — CANONICAL, synced from tbc-platform-workspace.
#
# Source of truth: scripts/workflows/dependabot-auto-merge.yml in tbc-platform-workspace.
# DO NOT edit this file in-repo — change the workspace copy and run
# `make workflows ARGS="--apply"` to roll the update out everywhere. `make
# workflows` (no args) reports any repo whose copy has drifted from canonical.
#
# Behaviour: for non-major Dependabot updates, enable auto-merge (squash).
# GitHub completes the merge only after required status checks pass — those are
# the CI checks enforced by `make protect` (branch protection). Major updates
# get a comment and wait for a human.
#
# We do NOT approve the PR: branch protection requires 0 approving reviews on
# every repo (see `make protect`), so an approval gates nothing — and GitHub
# Actions is not permitted to approve PRs under the org's default settings
# ("Allow GitHub Actions to create and approve pull requests" is off), so a
# `gh pr review --approve` step would fail and abort the job before auto-merge
# is ever enabled. Enabling auto-merge needs only `pull-requests: write`.
#
# Uses the default GITHUB_TOKEN: the permissions block below grants it write, so
# no personal access token (PAT) is needed.
name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # only gh CLI calls
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on major updates (manual review)
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: >-
          gh pr comment "$PR_URL" --body
          "🚨 Major version update — review and merge manually (auto-merge skips majors)."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
