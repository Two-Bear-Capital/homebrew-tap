version: 2
updates:
  # GitHub Actions used by the tap's workflows. (No package manifests to track —
  # the tap distributes the tbc CLI via Homebrew formulae, not a build.)
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
      - "github-actions"
    schedule:
      interval: "weekly"
    groups:
      all-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
